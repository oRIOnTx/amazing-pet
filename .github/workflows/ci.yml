name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - NOTICE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Changelog check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/check-changelog.sh "origin/$BASE_REF...HEAD"

      - name: Test
        run: swift test

      - name: Build app
        run: ./build.sh
