name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - NOTICE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelog check
        run: .github/scripts/check-changelog.sh "origin/${{ github.base_ref }}...HEAD"

      - name: Test
        run: swift test

      - name: Build app
        run: ./build.sh
