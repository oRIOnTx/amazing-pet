name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - NOTICE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app
        run: ./build.sh
