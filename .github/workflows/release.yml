name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - NOTICE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ARCHS: arm64 x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Changelog check
        if: github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/check-changelog.sh "$BEFORE..$GITHUB_SHA"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Bad tag::Release tags must look like v1.2.3, got $GITHUB_REF_NAME."
              exit 1
            fi
            if [[ -z "$(.github/scripts/changelog-section.sh "$version")" ]]; then
              echo "::error title=Changelog missing::CHANGELOG.md has no '## [$version]' section. Run the release step from CLAUDE.md before tagging."
              exit 1
            fi
            echo "VERSION=$version" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            version="$(.github/scripts/next-version.sh)"
            last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
            commits="$(git rev-list --count "${last:+$last..}HEAD")"
            echo "VERSION=$version" >> "$GITHUB_ENV"
            echo "RELEASE_LABEL=$version-nightly.$commits" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=nightly" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build and package
        run: ./package.sh

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/changelog-section.sh "$VERSION" > release-notes.md
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Amazing Pet $VERSION" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Publish nightly build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automatic build of \`main\` at ${GITHUB_SHA::7}, heading for $VERSION. For stable versions see the latest release."
            echo
            echo "## Changes since the last release"
            echo
            .github/scripts/changelog-section.sh Unreleased
          } > release-notes.md
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Nightly build ($RELEASE_LABEL)" \
            --notes-file release-notes.md
